# Espetinho Perus - Mistic Pay fixed-IP gateway
# VPS public IP: 191.252.185.6
#
# This server block is intended to be exposed through a dedicated HTTPS hostname.
# Replace GATEWAY_HOSTNAME before enabling.
#
# Create /etc/nginx/snippets/mistic-gateway-auth.conf locally with:
#   if ($http_x_gateway_key != "COLOQUE_AQUI_UMA_CHAVE_FORTE") { return 403; }
# Do NOT commit the real key.

server {
    listen 80;
    listen [::]:80;
    server_name GATEWAY_HOSTNAME;

    access_log /var/log/nginx/mistic-gateway.access.log;
    error_log  /var/log/nginx/mistic-gateway.error.log warn;

    client_max_body_size 1m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 20s;
    proxy_read_timeout 20s;

    location = /health {
        default_type application/json;
        return 200 '{"ok":true,"service":"mistic-gateway","egress_ip":"191.252.185.6"}';
    }

    location = /api/transactions/create {
        include /etc/nginx/snippets/mistic-gateway-auth.conf;

        proxy_pass https://api.misticpay.com/api/transactions/create;
        proxy_http_version 1.1;
        proxy_set_header Host api.misticpay.com;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name api.misticpay.com;

        proxy_pass_request_headers on;
        proxy_set_header X-Gateway-Key "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
    }

    location = /api/transactions/check {
        include /etc/nginx/snippets/mistic-gateway-auth.conf;

        proxy_pass https://api.misticpay.com/api/transactions/check;
        proxy_http_version 1.1;
        proxy_set_header Host api.misticpay.com;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name api.misticpay.com;

        proxy_pass_request_headers on;
        proxy_set_header X-Gateway-Key "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
    }

    location / {
        return 404;
    }
}
