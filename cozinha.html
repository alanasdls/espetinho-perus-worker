<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d0906">
  <title>Cozinha | Espetinho Perus</title>
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="cozinha.css?v=20260725-v10">
</head>
<body>
<header>
  <div><img src="logo-premium.png" alt=""><section><small>ESPETINHO PERUS</small><h1>Tela da cozinha</h1></section></div>
  <aside><span id="kitchenConnection">Conectando…</span><b id="kitchenClock"></b></aside>
</header>
<main>
  <section class="kitchen-summary">
    <article><span>Novos</span><strong id="kNew">0</strong></article>
    <article><span>Em preparo</span><strong id="kPreparing">0</strong></article>
    <article><span>Prontos</span><strong id="kReady">0</strong></article>
    <article><span>Tempo médio</span><strong id="kAverage">0 min</strong></article>
  </section>
  <div id="kitchenBoard" class="kitchen-board"></div>
</main>
<div id="kitchenLogin" class="kitchen-login" hidden>
  <form id="kitchenLoginForm"><img src="logo-premium.png" alt=""><h2>Senha do painel</h2>
  <input id="kitchenKey" type="password" placeholder="Senha"><button>Entrar</button></form>
</div>
<script src="cozinha.js?v=20260725-v10"></script>
</body>
</html>
